[package]
name = "mod_tool"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "cargo-b173"
path = "src/main.rs"

[dependencies]
anyhow = "1"
mod_protocol = { path = "../mod_protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
