[package]
name = "mod_protocol"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
default = ["framing"]
framing = ["dep:flate2"]

[dependencies]
flate2 = { version = "1.1", optional = true }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[lints]
workspace = true
